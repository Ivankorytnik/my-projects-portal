name: Verify live project order persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-project-order.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify live ordering persistence and restore original order
        env:
          SITE_URL: https://korytnikhub.pro/
          SYNC_URL: https://ytdacypygsfalkixhemj.supabase.co/functions/v1/hub-projects-sync
        run: |
          cat > verify-order.mjs <<'JS'
          import { chromium } from 'playwright';

          const site = process.env.SITE_URL;
          const syncUrl = process.env.SYNC_URL;

          async function getRemote() {
            const r = await fetch(syncUrl, { cache: 'no-store' });
            if (!r.ok) throw new Error(`cloud GET ${r.status}`);
            const data = await r.json();
            if (!data?.ok || !Array.isArray(data.projects)) throw new Error('cloud payload invalid');
            return data.projects;
          }

          async function saveRemote(projects) {
            const r = await fetch(syncUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ projects })
            });
            if (!r.ok) throw new Error(`cloud POST ${r.status}`);
          }

          async function waitReady(page) {
            await page.waitForFunction(() => document.documentElement.classList.contains('hub-sync-ready'), null, { timeout: 20000 });
            await page.waitForFunction(() => document.querySelectorAll('.project-card[data-project-id]').length >= 2, null, { timeout: 20000 });
          }

          async function readOrder(page) {
            return await page.evaluate(() => Array.from(document.querySelectorAll('.project-card[data-project-id]')).map(card => card.dataset.projectId));
          }

          const original = await getRemote();
          if (original.length < 2) throw new Error('Need at least two projects to test ordering');
          const originalIds = original.map(p => p.id);
          console.log('ORIGINAL_FIRST_3', originalIds.slice(0, 3).join(','));

          let browser;
          try {
            browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.goto(`${site}?qa=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitReady(page);

            const before = await readOrder(page);
            if (before.length < 2) throw new Error('Not enough rendered cards');

            const sourceId = before[before.length - 1];
            const targetId = before[before.length - 2];
            console.log('TEST_MOVE', `${sourceId} before ${targetId}`);

            await page.evaluate(({ sourceId, targetId }) => {
              const source = document.querySelector(`.project-card[data-project-id="${sourceId}"]`);
              const target = document.querySelector(`.project-card[data-project-id="${targetId}"]`);
              if (!source || !target) throw new Error('Drag cards not found');
              const dt = new DataTransfer();
              source.dispatchEvent(new DragEvent('dragstart', { bubbles: true, cancelable: true, dataTransfer: dt }));
              target.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: dt }));
              target.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }));
              source.dispatchEvent(new DragEvent('dragend', { bubbles: true, cancelable: true, dataTransfer: dt }));
            }, { sourceId, targetId });

            await page.waitForTimeout(1200);
            const afterDrag = await readOrder(page);
            const movedIndex = afterDrag.indexOf(sourceId);
            const targetIndex = afterDrag.indexOf(targetId);
            if (movedIndex < 0 || targetIndex < 0 || movedIndex >= targetIndex) {
              throw new Error(`Drag did not reorder cards: source=${movedIndex}, target=${targetIndex}`);
            }
            console.log('DRAG_OK');

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitReady(page);
            const afterReload = await readOrder(page);
            if (afterReload.indexOf(sourceId) >= afterReload.indexOf(targetId)) {
              throw new Error('Order was not preserved after reload');
            }
            console.log('RELOAD_OK');
            await context.close();

            const freshContext = await browser.newContext();
            const freshPage = await freshContext.newPage();
            await freshPage.goto(`${site}?qa=fresh-${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitReady(freshPage);
            const afterFreshEntry = await readOrder(freshPage);
            if (afterFreshEntry.indexOf(sourceId) >= afterFreshEntry.indexOf(targetId)) {
              throw new Error('Order was not preserved in a fresh browser context');
            }
            console.log('FRESH_ENTRY_OK');
            await freshContext.close();
          } finally {
            await saveRemote(original);
            await new Promise(resolve => setTimeout(resolve, 600));
            const restored = await getRemote();
            const restoredIds = restored.map(p => p.id);
            if (JSON.stringify(restoredIds) !== JSON.stringify(originalIds)) {
              throw new Error('Original cloud order was not restored');
            }
            console.log('RESTORE_OK');
            if (browser) await browser.close();
          }
          JS
          node verify-order.mjs
