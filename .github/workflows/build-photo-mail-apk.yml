name: Build PhotoToMail APK

on:
  push:
    branches: [main]
    paths:
      - 'photo-mail/android/**'
      - '.github/workflows/build-photo-mail-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: photo-mail/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK into website
        run: |
          mkdir -p photo-mail/download
          cp photo-mail/android/app/build/outputs/apk/debug/app-debug.apk photo-mail/download/PhotoToMail.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photo-mail/download/PhotoToMail.apk
          if git diff --cached --quiet; then
            echo 'APK is unchanged'
          else
            git commit -m 'Build PhotoToMail APK v1.0.0'
            git push
          fi
