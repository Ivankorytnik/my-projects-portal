name: Sync TestDrive templates

on:
  push:
    paths:
      - '.github/workflows/sync-testdrive-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download authorized TestDrive_Doc package
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-c030-8210-b83f-6f057a9e5976/raw?se=2026-09-02T06%3A51%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=f83973ac-3788-5976-a136-ed9a4c12fc39&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T05%3A19%3A00Z&ske=2026-09-03T05%3A19%3A00Z&sks=b&skv=2026-02-06&sig=BrE9vtGhPgsu7cvrr2oxEO0sk5c9FPRLHgZUlAEcwB4%3D' -o /tmp/TestDrive_Doc.zip
          unzip -t /tmp/TestDrive_Doc.zip

      - name: Publish Word templates
        run: |
          set -euo pipefail
          mkdir -p testdrive/templates
          rm -f testdrive/templates/*.docx
          unzip -j /tmp/TestDrive_Doc.zip 'TestDrive_Doc/templates/*.docx' -d testdrive/templates
          test -f testdrive/templates/poa_template.docx
          test -f testdrive/templates/questionnaire_template.docx
          test -f testdrive/templates/consent_template.docx
          cd testdrive/templates
          sha256sum *.docx > SHA256SUMS.txt
          cat > manifest.json <<EOF
          {
            "version": "2026.09.02-1",
            "updated": "2026-09-02",
            "templates": {
              "poa": "poa_template.docx",
              "questionnaire": "questionnaire_template.docx",
              "consent": "consent_template.docx"
            }
          }
          EOF

      - name: Commit templates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testdrive/templates
          if git diff --cached --quiet; then
            echo 'Templates are already current.'
            exit 0
          fi
          git commit -m 'Publish TestDrive_Doc web templates'
          git push

# one-time authorized publish 2026-09-02
