name: Sync TestDrive templates

on:
  push:
    paths:
      - '.github/workflows/sync-testdrive-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current TestDrive_Doc package
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1qEC2-mnzUOEr_XpxsCQclw3JuHFEJBx8' \
            -o /tmp/TestDrive_Doc.zip
          unzip -t /tmp/TestDrive_Doc.zip

      - name: Publish Word templates
        run: |
          set -euo pipefail
          mkdir -p testdrive/templates
          rm -f testdrive/templates/*.docx
          unzip -j /tmp/TestDrive_Doc.zip 'TestDrive_Doc/templates/*.docx' -d testdrive/templates
          test -f testdrive/templates/poa_template.docx
          test -f testdrive/templates/questionnaire_template.docx
          test -f testdrive/templates/consent_template.docx
          cd testdrive/templates
          sha256sum *.docx > SHA256SUMS.txt
          cat > manifest.json <<EOF
          {
            "version": "2026.09.02-1",
            "updated": "2026-09-02",
            "templates": {
              "poa": "poa_template.docx",
              "questionnaire": "questionnaire_template.docx",
              "consent": "consent_template.docx"
            }
          }
          EOF

      - name: Commit templates
        run: |
          set -euo pipefail
          if git diff --quiet -- testdrive/templates; then
            echo 'Templates are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testdrive/templates
          git commit -m 'Publish TestDrive_Doc web templates'
          git push
