name: Sync projects into Korytnik Hub

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-projects.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          path: hub
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Speech Lab
        uses: actions/checkout@v4
        with:
          repository: Ivankorytnik/Sound
          path: src-sound

      - name: Checkout Fishing Day
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          repository: Ivankorytnik/fishing-day
          path: src-fishing

      - name: Checkout KP AUTO
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          repository: Ivankorytnik/KP_AUTO
          path: src-auto

      - name: Copy projects into hub paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hub/sound
          rsync -a --delete --exclude='.git' --exclude='CNAME' src-sound/ hub/sound/
          test -s hub/sound/index.html && test -s hub/sound/styles.css && test -s hub/sound/folder-save.js
          echo "Speech Lab synchronized from $(git -C src-sound rev-parse --short HEAD)"
          test -f hub/sound/styles.css && grep -q 'Dictaphone: auto-transcription toggle and recording status side-by-side' hub/sound/styles.css
          # On workflow updates, publish only Speech Lab; preserve every other project.
          # Scheduled/manual runs also sync the two available external repositories.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            mkdir -p hub/fishing hub/auto
            rsync -a --delete --exclude='.git' --exclude='CNAME' src-fishing/ hub/fishing/
            rsync -a --delete --exclude='.git' --exclude='CNAME' src-auto/ hub/auto/
          fi
          # Calculator repository is no longer accessible. Keep existing hub/calculator.

      - name: Commit synchronized projects
        shell: bash
        working-directory: hub
        run: |
          set -e
          git config user.name 'korytnik-hub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sound
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            git add fishing auto
          fi
          if git diff --cached --quiet; then
            echo 'No project changes to sync.'
            exit 0
          fi
          git commit -m 'Sync project sites into hub paths'
          git pull --rebase origin main
          git push origin main
