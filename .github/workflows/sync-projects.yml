name: Sync projects into Korytnik Hub

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-projects.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          path: hub
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Speech Lab
        uses: actions/checkout@v4
        with:
          repository: Ivankorytnik/Sound
          path: src-sound

      - name: Checkout Fishing Day
        uses: actions/checkout@v4
        with:
          repository: Ivankorytnik/fishing-day
          path: src-fishing

      - name: Checkout calculator
        uses: actions/checkout@v4
        with:
          repository: Ivankorytnik/calculator
          path: src-calculator

      - name: Checkout KP AUTO
        uses: actions/checkout@v4
        with:
          repository: Ivankorytnik/KP_AUTO
          path: src-auto

      - name: Copy projects into hub paths
        shell: bash
        run: |
          set -e
          rm -rf hub/sound hub/fishing hub/calculator hub/auto
          mkdir -p hub/sound hub/fishing hub/calculator hub/auto
          rsync -a --delete --exclude='.git' --exclude='CNAME' src-sound/ hub/sound/
          rsync -a --delete --exclude='.git' --exclude='CNAME' src-fishing/ hub/fishing/
          rsync -a --delete --exclude='.git' --exclude='CNAME' src-calculator/ hub/calculator/
          rsync -a --delete --exclude='.git' --exclude='CNAME' src-auto/ hub/auto/

      - name: Commit synchronized projects
        shell: bash
        working-directory: hub
        run: |
          set -e
          git config user.name 'korytnik-hub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sound fishing calculator auto
          if git diff --cached --quiet; then
            echo 'No project changes to sync.'
            exit 0
          fi
          git commit -m 'Sync project sites into hub paths'
          git push
