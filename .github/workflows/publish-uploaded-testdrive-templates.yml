name: Publish uploaded TestDrive templates

on:
  push:
    paths:
      - '.template-payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact uploaded DOCX templates
        run: |
          set -euo pipefail
          mkdir -p testdrive/templates
          cat .template-payload/poa.part* | tr -d '\n' | base64 -d > testdrive/templates/poa_template.docx
          cat .template-payload/questionnaire.part* | tr -d '\n' | base64 -d > testdrive/templates/questionnaire_template.docx
          cat .template-payload/consent.part* | tr -d '\n' | base64 -d > testdrive/templates/consent_template.docx
          unzip -t testdrive/templates/poa_template.docx
          unzip -t testdrive/templates/questionnaire_template.docx
          unzip -t testdrive/templates/consent_template.docx
          cd testdrive/templates
          sha256sum *.docx > SHA256SUMS.txt
          cat > manifest.json <<'EOF'
          {
            "version": "2026.09.02-uploaded",
            "updated": "2026-09-02",
            "source": "user-uploaded-approved-templates",
            "templates": {
              "poa": "poa_template.docx",
              "questionnaire": "questionnaire_template.docx",
              "consent": "consent_template.docx"
            }
          }
          EOF
      - name: Commit exact templates and remove payload
        run: |
          set -euo pipefail
          rm -rf .template-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A testdrive/templates .template-payload
          git commit -m 'Use user-approved TestDrive templates'
          git push
