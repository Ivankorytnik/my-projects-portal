name: Build TestDrive Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "testdrive/**"
      - "package.json"
      - ".github/workflows/build-testdrive-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable app
        run: npm run dist

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: TestDrive-Doc-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
