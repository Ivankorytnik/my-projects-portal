<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Speech Lab</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #03090e; font-family: Arial, Helvetica, sans-serif; color: #f5fbff; }
    body { overflow: hidden; }
    .app-shell { height: 100vh; display: grid; grid-template-rows: auto 1fr; background: linear-gradient(180deg,#07131c 0%,#03090e 100%); }
    .tabs-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:62px; padding:10px 20px; border-bottom:1px solid rgba(151,190,211,.14); background:rgba(5,15,22,.96); box-shadow:0 10px 30px rgba(0,0,0,.18); z-index:5; }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand img { width:38px; height:38px; border-radius:11px; }
    .brand-copy { display:grid; gap:2px; }
    .brand-copy strong { font-size:14px; letter-spacing:-.02em; }
    .brand-copy small { color:#607583; font-size:9px; letter-spacing:.08em; }
    .tabs { display:inline-grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; border:1px solid rgba(151,190,211,.14); border-radius:15px; background:rgba(7,20,28,.9); }
    .tab { min-width:150px; min-height:38px; padding:0 16px; border:1px solid transparent; border-radius:11px; background:transparent; color:#8da4b3; cursor:pointer; font-size:9px; font-weight:900; letter-spacing:.08em; transition:.18s ease; }
    .tab:hover { color:#eaf8ff; background:rgba(49,213,255,.04); }
    .tab.active { color:#031319; background:linear-gradient(135deg,#84ebff,#31d5ff); box-shadow:0 8px 22px rgba(49,213,255,.13); }
    .frame-wrap { position:relative; min-height:0; }
    .workspace-frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#03090e; }
    .workspace-frame.hidden { display:none; }
    @media (max-width:700px) { .tabs-bar{padding:8px 10px;gap:8px}.brand-copy small{display:none}.tabs{flex:1}.tab{min-width:0;padding:0 10px;font-size:8px} }
    @media (max-width:480px) { .brand-copy{display:none}.brand img{width:34px;height:34px} }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="tabs-bar">
      <div class="brand">
        <img src="./favicon-192.png" alt="" />
        <div class="brand-copy"><strong>SPEECH LAB</strong><small>LOCAL AI / VOICE TO TEXT</small></div>
      </div>
      <nav class="tabs" aria-label="Разделы Speech Lab">
        <button class="tab active" id="speechTab" type="button" aria-selected="true">РАСПОЗНАВАНИЕ</button>
        <button class="tab" id="prompterTab" type="button" aria-selected="false">СУФЛЁР AI</button>
      </nav>
    </header>
    <section class="frame-wrap">
      <iframe id="speechFrame" class="workspace-frame" src="./speech.html" title="Speech Lab — распознавание"></iframe>
      <iframe id="prompterFrame" class="workspace-frame hidden" src="./prompter.html" title="Speech Lab — Суфлёр AI" allow="microphone; display-capture"></iframe>
    </section>
  </main>
  <script>
    (() => {
      const speechTab=document.getElementById('speechTab');
      const prompterTab=document.getElementById('prompterTab');
      const speechFrame=document.getElementById('speechFrame');
      const prompterFrame=document.getElementById('prompterFrame');
      function openTab(name){
        const prompter=name==='prompter';
        speechFrame.classList.toggle('hidden',prompter);
        prompterFrame.classList.toggle('hidden',!prompter);
        speechTab.classList.toggle('active',!prompter);
        prompterTab.classList.toggle('active',prompter);
        speechTab.setAttribute('aria-selected',prompter?'false':'true');
        prompterTab.setAttribute('aria-selected',prompter?'true':'false');
        try{sessionStorage.setItem('speech-lab-tab',prompter?'prompter':'speech')}catch{}
      }
      speechTab.addEventListener('click',()=>openTab('speech'));
      prompterTab.addEventListener('click',()=>openTab('prompter'));
      let initial='speech';
      try{initial=sessionStorage.getItem('speech-lab-tab')||'speech'}catch{}
      openTab(initial);
    })();
  </script>
</body>
</html>
